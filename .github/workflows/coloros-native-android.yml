name: ColorOS Native Android

on:
  push:
    branches:
      - feature/coloros-native-backend
  pull_request:
    branches:
      - kmp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 / API 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Android demo
        run: ./gradlew --stacktrace --no-daemon :androidApp:assembleDebug

      - name: Verify APK
        run: |
          APK="androidApp/build/outputs/apk/debug/androidApp-debug.apk"
          test -f "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$APK" | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: coloros-native-comparison-debug-apk
          if-no-files-found: error
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
